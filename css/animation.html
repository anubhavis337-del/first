<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        background-color: black;
      }
      .box {
        width: 220px;
        height: 70px;
        background-color: white;
        border-radius: 12px;

        animation-name:slide;
        animation-delay:2s;
        animation-timing-function:infinite;
        animation-duration:1s;
        animation-direction:alternate;
        animation-iteration-count:4;

        position:relative;
      }

  
      @keyframes slide {
        0%{
            top:0;
            left:0;
        } 
        25%{
            top:0px;
            left:320px;
        }
        50%{
            top:0px;
            left:640px;
        }
        75%{
            top:0px;
            left:960px;
        }
          100%{
            top:0px;
            left:1280px;
          }
      }

      .ball{
        height :50px;
        width: 50px;
        background-color: rgb(25, 0, 255);
        border-radius: 50%;
        margin-left: 2%;


        animation-name:rolling;
        animation-delay:2s;
        animation-duration:1s;
        animation-timing-function:infinite;
        animation-iteration-count:4;
        animation-direction:alternate;
        position:relative;
      }

      @keyframes rolling{
        0%{
            top:0;
            left:0;
        } 
        25%{
            top:510px;
            left:320px;
        }
        50%{
            top:0px;
            left:650px;
        }
        75%{
            top:510px;
            left:970px;
        }
          100%{
            top:0px;
            left:1290px;
          }
      }

      .box1{
        margin-top:32%;
        
      }
    </style>
  </head>

  
  <body>
    <div class="box"></div>
    <div class="ball"></div>
    <div class="box box1"></div>
  </body>
</html>
