<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        justify-content: center;
        display: flex;
        align-items: center;
        min-height: 100vh;
        background: radial-gradient(
          circle,
          rgba(238, 174, 202, 1) 0%,
          rgba(148, 187, 233, 1) 100%
        );
      }

      h1 {
        color: white;
      }

      .box {
        height: 400px;
        width: 300px;
        background-color: rgb(17, 174, 153);
        box-shadow: 5px 5px 5px 5px rgb(64, 52, 52);
        /* border: 2px soolid blue; */
        border-radius: 4px;

        background: radial-gradient(
          circle,
          rgba(238, 174, 202, 1) 30%,
          rgba(238, 174, 202, 1) 40%,
          rgba(204, 179, 214, 1) 63%,
          rgba(166, 184, 227, 1) 88%,
          rgba(148, 187, 233, 1) 100%
        );

    box-hover{
     cursor:crosshair;
    }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Box</h1>
    </div>
  </body>
</html>
