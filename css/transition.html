<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>

    body{
        height:100vh;
        display:flex;
        justify-content: center;
        align-items: center;
    }
    .box{
        height: 300px;
        width:300px;
        background-color: red;
       
        

        transition-property: all;
        transition-duration: 1s;
        transition-timing-function: linear;
        transition-delay:1s ;
    }

    .box:hover{
        height: 500px;
        width:500px;
        background-color: rgb(70, 58, 161);
        border-radius: 500px;
        /* border:50px solid black; */
    }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
