<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
*{
    margin: 0;
    padding: 0;
    
}
body{
    background-color: bisque;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.ball{
    background-color: brown;
    height: 100px;
    width: 100px;
    border-radius: 50%;
    
}

.loader{
    display:flex;
    gap:10px;
}
.dot{
    background-color: gray;
    height: 15px;
    width:15px;
    border-radius: 50%;
    animation:loader 0.8s linear infinite alternate;
}

.dot:nth-child(2) {
    animation-delay: 0.1s;
}
.dot:nth-child(3){
    animation-delay: 0.2s;
}
.dot:nth-child(4){
    animation-delay:0.3s;
}
.dot:nth-child(5){
    animation-delay:0.4s;
}
.dot:nth-child(6){
    animation-delay: 0.5s;
}
@keyframes loader{
    from{
        transform:translate(-20px);

    }to{
        transform:translate(20px);
        }
    }

        transform: scale(1);
    }
    50%{
        transform:scale(1.2);
    } */

        transform:scale(1);

</style>
<body>
   <div class="ball"></div> 


<div class="pulse"></div>
    <div class="loader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

    </div>
   </div>
</body>
</html>
